# HelloXiaoZhi 自动化发布工作流
#
# 触发条件：仅当推送符合语义化版本规范的标签时触发（无前缀），例如：
#   1.0.0 / 1.0.0-alpha.1 / 1.0.0-beta.2 / 1.0.0-rc.1
# v 前缀及任意非数字开头的标签不会触发。
#
# 流程：检出（完整历史）→ JDK 21 → Gradle 缓存 → Android SDK
#       → assembleRelease + bundleRelease → 按 Conventional Commits 生成中文更新日志
#       → 制品重命名 + SHA256 校验 → 发布 GitHub Release（含 -alpha/-beta/-rc 自动标记 Prerelease）
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号（必填，不带 v 前缀），例如 1.2.0 或 1.2.0-beta.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史，供更新日志生成）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle（依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK（许可接受 + 自动供给 platform/NDK/CMake）
        uses: android-actions/setup-android@v3

      - name: Resolve tag
        id: tag
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              TAG="${{ github.event.inputs.version }}"
              # 归一化：去掉误输入的 v 前缀，与无前缀标签规范保持一致
              TAG="${TAG#v}"
              ;;
            *)
              TAG="${{ github.ref_name }}"
              ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Release APK + AAB
        # gradle.properties 中钉死了本机 Windows JDK 路径，
        # 必须用命令行 -D 覆盖（命令行属性优先于 gradle.properties），否则 Linux runner 失败。
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"

      - name: Generate release notes
        run: |
          bash .github/scripts/gen-release-notes.sh "${{ steps.tag.outputs.name }}" > release_notes.md
          echo '--- release_notes.md ---'
          cat release_notes.md

      - name: Package artifacts
        run: |
          set -e
          mkdir -p dist
          TAG="${{ steps.tag.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/HelloXiaoZhi-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/HelloXiaoZhi-${TAG}.aab"
          (cd dist && sha256sum HelloXiaoZhi-* > SHA256SUMS)
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: HelloXiaoZhi ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          files: |
            dist/HelloXiaoZhi-*.apk
            dist/HelloXiaoZhi-*.aab
            dist/SHA256SUMS
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
